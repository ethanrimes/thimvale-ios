name: iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  # Do not interrupt an upload already running for main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen cmake
      - uses: actions/cache@v4
        with:
          path: Vendor
          key: native-b10830-kiwix14212-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'scripts/build-simulator-runtime.sh') }}
      - name: Bootstrap native libraries
        run: ./scripts/bootstrap.sh
      - name: Test permissions and retrieval
        run: swift test
      - name: Test release configuration validation
        run: python3 -m unittest discover -s Tests/Release -v
      - name: Build iPhone app
        run: xcodebuild -project Thimvale.xcodeproj -scheme Thimvale -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build simulator app
        run: xcodebuild -project Thimvale.xcodeproj -scheme Thimvale -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Fetch real inference and Wikipedia fixtures
        run: ./scripts/fetch-test-assets.sh
      - name: Exercise simulator UI and native integration
        run: |
          THIMVALE_SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")]; print(devices[0]["udid"])')
          xcodebuild test -project Thimvale.xcodeproj -scheme Thimvale \
            -destination "platform=iOS Simulator,id=$THIMVALE_SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath TestResults/CI.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: TestResults/CI.xcresult
          retention-days: 7
  testflight:
    name: Archive and upload to TestFlight
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/release.py preflight
      - name: Install build tools
        run: brew install xcodegen cmake
      - uses: actions/cache@v4
        with:
          path: Vendor
          key: native-b10830-kiwix14212-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'scripts/build-simulator-runtime.sh') }}
      - name: Bootstrap native libraries
        run: ./scripts/bootstrap.sh
      - name: Sign and upload this commit
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/release.py upload
