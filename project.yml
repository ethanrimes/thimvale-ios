name: PocketMind
options:
  bundleIdPrefix: com.ethanrimes
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.8.8
targets:
  PocketMind:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.pocketmind
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Native/PocketNative.h
        HEADER_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Vendor'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PocketMind
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
      - framework: Vendor/libkiwix_xcframework-14.2.1-2/lib/CoreKiwix.xcframework
        embed: false
      - package: SwiftSoup
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: NaturalLanguage.framework
  PocketMindIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/Integration
    dependencies:
      - target: PocketMind
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.pocketmind.integrationtests
  PocketMindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UI
    dependencies:
      - target: PocketMind
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.pocketmind.uitests
schemes:
  PocketMind:
    build:
      targets:
        PocketMind: all
    test:
      targets:
        - PocketMindIntegrationTests
        - PocketMindUITests
      environmentVariables:
        POCKETMIND_NETWORK_TESTS: '1'
