name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: android
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: android/Vendor
          key: android-native-b10830-${{ hashFiles('android/scripts/bootstrap.sh') }}
      - name: Check shared model catalog
        run: python3 ../scripts/sync-catalog.py --check
      - name: Bootstrap native inference
        run: ./scripts/bootstrap.sh
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Verify native 16 KB alignment
        run: python3 scripts/check-native-alignment.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
