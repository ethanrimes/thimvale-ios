name: Thimvale
options:
  bundleIdPrefix: com.ethanrimes
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.8.8
targets:
  Thimvale:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - path: LICENSES
        buildPhase: resources
        type: folder
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        # Match the app record registered by the owner in App Store Connect.
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.thimvale
        # CI overrides only this app target, not Swift packages/framework targets.
        THIMVALE_CODE_SIGN_STYLE: Automatic
        THIMVALE_CODE_SIGN_IDENTITY: Apple Development
        THIMVALE_DEVELOPMENT_TEAM: ''
        THIMVALE_PROVISIONING_PROFILE: ''
        CODE_SIGN_STYLE: '$(THIMVALE_CODE_SIGN_STYLE)'
        CODE_SIGN_IDENTITY: '$(THIMVALE_CODE_SIGN_IDENTITY)'
        DEVELOPMENT_TEAM: '$(THIMVALE_DEVELOPMENT_TEAM)'
        PROVISIONING_PROFILE_SPECIFIER: '$(THIMVALE_PROVISIONING_PROFILE)'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Native/PocketNative.h
        HEADER_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Vendor'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thimvale
        # Owner-confirmed: only exempt OS-provided encryption. Reassess if that changes.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
      - framework: Vendor/libkiwix_xcframework-14.2.1-2/lib/CoreKiwix.xcframework
        embed: false
      - package: SwiftSoup
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: NaturalLanguage.framework
  ThimvaleIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/Integration
    dependencies:
      - target: Thimvale
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.thimvale.integrationtests
  ThimvaleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UI
    dependencies:
      - target: Thimvale
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.thimvale.uitests
schemes:
  ThimvaleExperiments:
    build:
      targets:
        Thimvale: all
    test:
      targets:
        - ThimvaleIntegrationTests
      environmentVariables:
        THIMVALE_EXPERIMENTS: '1'
        THIMVALE_TEST_SESSION: '304C10D1-536B-4819-93CA-BC35C6E80247'
  Thimvale:
    build:
      targets:
        Thimvale: all
    test:
      targets:
        - ThimvaleIntegrationTests
        - ThimvaleUITests
      environmentVariables:
        THIMVALE_NETWORK_TESTS: '1'
        THIMVALE_TEST_SESSION: '83DFF56A-63CB-4B79-9CF1-4DE662F3A137'
